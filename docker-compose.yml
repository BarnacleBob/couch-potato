services:
  couch-potato:
    build: .
    image: couch-potato
    container_name: couch-potato
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      # Only reachable from this machine by default. Set BIND_IP in .env (e.g. your Tailscale IP) to share it.
      - "${BIND_IP:-127.0.0.1}:8787:8787"
    volumes:
      - ./data:/app/data          # history, lineups, subscriptions, caches
      - ./stations:/app/stations  # station presets; edits from Settings land in your checkout
    restart: unless-stopped
